# 个人测试用：GitHub 托管机上出一份完整的 Windows 启动器目录（含本分支的 iOS 预编壳），作为 Actions artifact 下载。
#   mac 作业：预编壳（pack/shell_build.sh）+ 时区（make_tzdata.sh --bundle-to）+ 开源共享字体（make_open_fonts.py）
#   windows 作业：bundle_win.py 组装（引擎快照、预编件、随包运行时、Impactor）+ dotnet publish 出 S2Arm.exe
#   不碰游戏文件、密钥、存档。不进上游 PR（只放在测试分支上）。
name: shell-build
on:
  push:
    branches: ['test/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shell-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shell:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: compat/tree/global.json
      - name: Homebrew 工具（bash 5、GNU make、构建 venv 用的 python@3.12、cmake / meson / ninja）
        run: |
          brew install bash make python@3.12 cmake meson ninja
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: 选 iOS SDK 主版本对得上 tools/toolchain.env 的 Xcode
        run: |
          want=$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" { print $2 }' tools/toolchain.env)
          echo "要 iOS SDK 主版本 $want；托管机上的 Xcode："
          pick=
          for x in /Applications/Xcode*.app; do
            v=$(DEVELOPER_DIR="$x/Contents/Developer" xcrun --sdk iphoneos --show-sdk-version 2> /dev/null) || continue
            echo "  $x → iOS SDK $v"
            [ "${v%%.*}" = "$want" ] && pick=$x
          done
          [ -n "$pick" ] || { echo "【红】托管机没有 iOS SDK $want 的 Xcode，出不了壳"; exit 1; }
          echo "用 $pick"
          sudo xcode-select -s "$pick/Contents/Developer"
          echo "S2A_DEVELOPER_DIR=$pick/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -downloadComponent MetalToolchain || echo "（Metal 工具链下载没成功，若已预装可忽略）"
      - name: 一键准备构建依赖（launchers/macos/prepare_build.py：venv、C 改写器钉版源码）
        run: python3 launchers/macos/prepare_build.py
      - name: 兼容层上游基线
        run: bash compat/fetch_base.sh
      - name: 出壳
        env:
          S2A_REWRITER_DEPS: ${{ github.workspace }}/build/rewriter-deps
          S2A_PY: ${{ github.workspace }}/build/venv/bin/python
          S2A_RUN_ROOT: ${{ runner.temp }}/s2a-run
        run: |
          set -o pipefail
          out="$RUNNER_TEMP/shell"
          if bash pack/shell_build.sh "$out" 2>&1 | tee "$RUNNER_TEMP/shell.log"; then
            echo "壳输入闭包：已核" >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '表外' "$RUNNER_TEMP/shell.log"; then
            # 托管机文件系统的访问时间不可靠时闭包核会误报：重出一次只写建议表、不判红（个人测试壳，摘要里注明）
            rm -rf "$out"
            S2A_SHELL_CLOSURE_SUGGEST="$RUNNER_TEMP/closure_suggest.txt" bash pack/shell_build.sh "$out"
            echo "壳输入闭包：托管机上没核（访问时间不可靠），仅供个人测试" >> "$GITHUB_STEP_SUMMARY"
          else
            # 失败原因写成一条公开注解（不登录也能从 check-runs annotations 读到）
            msg=$(tail -n 60 "$RUNNER_TEMP/shell.log" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=shell_build failed::$msg"
            exit 1
          fi
          python3 -c "import json,sys; d=json.load(open(sys.argv[1]))['details']; print('shellId', d['shellId'], 'iosSdk', d['iosSdk'], 'commit', d['sourceCommit'])" "$out/manifest.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 时区数据与开源共享字体（Windows 组装要的另两样 Mac 产物）
        env:
          S2A_RUN_ROOT: ${{ runner.temp }}/s2a-run
        run: |
          set -o pipefail
          { bash services/systemdata/make_tzdata.sh --prepare-sources \
            && bash services/systemdata/make_tzdata.sh --bundle-to "$RUNNER_TEMP/tzdata" \
            && build/venv/bin/python pack/fonts/make_open_fonts.py "$RUNNER_TEMP/fonts"; } 2>&1 | tee "$RUNNER_TEMP/extras.log" || {
            msg=$(tail -n 40 "$RUNNER_TEMP/extras.log" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=tzdata/fonts failed::$msg"; exit 1; }
          ls "$RUNNER_TEMP/tzdata" "$RUNNER_TEMP/fonts"
      - name: 打包三样给 Windows 作业（ditto 保留壳目录原样）
        run: cd "$RUNNER_TEMP" && ditto -c -k --keepParent shell s2arm-shell.zip && ditto -c -k --keepParent tzdata tzdata.zip && ditto -c -k --keepParent fonts fonts.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-inputs
          path: |
            ${{ runner.temp }}/s2arm-shell.zip
            ${{ runner.temp }}/tzdata.zip
            ${{ runner.temp }}/fonts.zip
          retention-days: 7

  launcher:
    needs: shell
    # 随包 VC++ 运行库钉 14.44.35112（VS 2022 17.14 的 Redist）：windows-latest 已是 VS 2026，用还带 VS 2022 的 windows-2025
    runs-on: windows-2025
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --system core.longpaths true
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: compat/tree/global.json
      - name: 编译工具（LLVM clang、ninja）与钉版 Python 包
        run: |
          echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
          python -m pip install ninja -r tools/rewriter-requirements.txt -r launchers/macos/requirements-runtime.txt
          "C:/Program Files/LLVM/bin/clang" --version | head -1; cmake --version | head -1; cargo --version; dotnet --version
      - name: C 改写器固定依赖
        run: python runtime/rewriter/prepare_deps.py build/rewriter-deps
      - uses: actions/download-artifact@v4
        with:
          name: mac-inputs
          path: ${{ runner.temp }}/mac
      - name: 解开 Mac 产物
        run: |
          cd "$RUNNER_TEMP/mac" && for z in s2arm-shell tzdata fonts; do python -m zipfile -e "$z.zip" . || exit 1; done && ls && ls shell
      - name: Git for Windows 2.54.0（随包 bash / MinGit 跟这份版本走，runtime_cache.py 只钉了 2.54.0 的哈希）
        run: |
          v=$(python -c "import re; print(re.search(r'MinGit-(\d+\.\d+\.\d+)-64-bit', open('launchers/shared/runtime_cache.py',encoding='utf-8').read()).group(1))")
          echo "钉的 Git 版本：$v"
          curl -fsSL -o "$RUNNER_TEMP/pgit.7z.exe" "https://github.com/git-for-windows/git/releases/download/v$v.windows.1/PortableGit-$v-64-bit.7z.exe"
          7z x "$RUNNER_TEMP/pgit.7z.exe" -oC:/pgit -y > /dev/null
          C:/pgit/cmd/git.exe --version
      - name: zstd 1.5.7（随包运行时收它；bundle_runtime_win.py 缺省路径是出包机自己的目录）
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zstd.zip" https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip
          cd C:/ && python -m zipfile -e "$RUNNER_TEMP/zstd.zip" C:/zstd && ls C:/zstd/zstd-v1.5.7-win64
          ls "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Redist/MSVC/" || true
      - name: 组装启动器目录（bundle_win.py）
        env:
          S2A_REWRITER_DEPS: ${{ github.workspace }}/build/rewriter-deps
          S2A_RUN_ROOT: C:/s2a-run
          S2A_RT_GIT: C:\pgit
          S2A_RT_ZSTD: C:\zstd\zstd-v1.5.7-win64
          PYTHONUTF8: '1'
          # CMake 缺省生成器在托管机上是 Visual Studio（cl.exe）：C 改写器 / Capstone 要 clang（__int128 等），同出包机走 Ninja + LLVM clang
          CMAKE_GENERATOR: Ninja
          CC: clang
          CXX: clang++
        run: |
          set -o pipefail
          m="$RUNNER_TEMP/mac"
          # 预编件按 cc > clang > gcc 找编译器（graphics/tools/nxfmt.py）：托管机上的 cc 是 MinGW gcc，不认 MSVC 目标的 -Wl,/EXPORT；
          #   本步把带 cc.exe 的目录从 PATH 拿掉，统一走 LLVM clang（同 Windows 出包机）
          echo "cc 在：$(which -a cc 2> /dev/null | tr '\n' ' ')"
          PATH=$(printf %s "$PATH" | tr ':' '\n' | while IFS= read -r d; do if [ -e "$d/cc.exe" ] || [ -e "$d/cc" ]; then echo "PATH 去掉 $d" >&2; else printf '%s\n' "$d"; fi; done | paste -sd: -)
          export PATH; which clang
          python -X utf8 launchers/windows/bundle_win.py C:/o/S2Arm --shell "$m/shell" --tzdata "$m/tzdata" --fonts "$m/fonts" 2>&1 | tee "$RUNNER_TEMP/bundle.log" || {
            msg=$( { tail -n 50 "$RUNNER_TEMP/bundle.log"; for f in build/windows/prepare-logs/*.log; do [ -f "$f" ] && { echo "== $f"; tail -n 15 "$f"; }; done; } | tail -n 120 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=bundle_win failed::$msg"; exit 1; }
      - name: 启动器程序 S2Arm.exe
        run: dotnet publish launchers/windows/launcher/App/S2Arm.csproj -c Release -r win-x64 --self-contained true -o C:/o/S2Arm
      - name: 打包
        run: |
          cd C:/o && 7z a -tzip -mx=5 "$RUNNER_TEMP/S2Arm-windows-test.zip" S2Arm > /dev/null
          echo "启动器 zip：$(( $(stat -c %s "$RUNNER_TEMP/S2Arm-windows-test.zip") / 1048576 )) MB" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: S2Arm-windows-test-${{ github.sha }}
          path: ${{ runner.temp }}/S2Arm-windows-test.zip
          retention-days: 14
          compression-level: 0
